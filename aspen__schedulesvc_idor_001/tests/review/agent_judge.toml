[judge]
judge = "claude-code"
timeout = 600
isolated = false
cwd = "/repo"
prompt_template = "prompt.md"

[[criterion]]
name = "rub_001"
description = "The agent's submitted diff satisfies this rubric item: A test asserts that a stranger (non-owner, non-admin) GET /schedules/{id} response does not contain the schedule owner's private internal_notes field. A status-code-only assertion does not satisfy this item; the test must seed a sentinel string into internal_notes and verify it is absent from the response body. The sentinel absence check must be unconditional — placing it inside an `if r.status_code == 200:` block that follows a prior `assert r.status_code != 200` assertion renders the body check dead code and does not satisfy this criterion. Category: access_control."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_002"
description = "The agent's submitted diff satisfies this rubric item: A test asserts that the GET /schedules list endpoint does not expose another owner's private schedule data (internal_notes or rate_code) to a stranger. A status-code-only assertion does not satisfy this item; the test must verify that a seeded sentinel string is absent from the list response body. Category: access_control."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_003"
description = "The agent's submitted diff satisfies this rubric item: A test asserts that the GET /schedules/search endpoint does not return another owner's private schedule content to a stranger. A status-code-only assertion does not satisfy this item; the test must verify that a seeded sentinel string is absent from the search response body. Category: access_control."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_004"
description = "The agent's submitted diff satisfies this rubric item: A test asserts that a stranger GET /schedules/{id}/entries response does not contain the private rate_code field from another owner's schedule entries. A status-code-only assertion does not satisfy this item; the test must seed a sentinel string into rate_code and verify it is absent from the entries response. The sentinel absence check must be unconditional — placing it inside an `if r.status_code == 200:` block that follows a prior `assert r.status_code != 200` assertion renders the body check dead code and does not satisfy this criterion. Category: access_control."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_005"
description = "The agent's submitted diff satisfies this rubric item: A test asserts that a stranger GET /schedules/{id}/export?format=json does not leak the private internal_notes field of another owner's schedule. A status-code-only assertion does not satisfy this item; the test must seed a sentinel string and verify it is absent from the JSON export response body. The sentinel absence check must be unconditional — placing it inside an `if r.status_code == 200:` block that follows a prior `assert r.status_code != 200` assertion renders the body check dead code and does not satisfy this criterion. Category: access_control."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_006"
description = "The agent's submitted diff satisfies this rubric item: A test asserts that a stranger GET /schedules/{id}/export?format=csv does not expose private sentinel data (internal_notes or rate_code) in the CSV rows. A status-code-only assertion does not satisfy this item; the test must inspect the CSV response body text for absent sentinel content. The sentinel absence check must be unconditional — placing it inside an `if r.status_code == 200:` block that follows a prior `assert r.status_code != 200` assertion renders the body check dead code and does not satisfy this criterion. Category: access_control."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_007"
description = "The agent's submitted diff satisfies this rubric item: A test asserts that a stranger GET /schedules/{id}/attachments?name=<file> does not return the private attachment content of another owner's schedule. A status-code-only assertion does not satisfy this item; the test must seed a sentinel string into an attachment value and verify it is absent from the download response. The sentinel absence check must be unconditional — placing it inside an `if r.status_code == 200:` block that follows a prior `assert r.status_code != 200` assertion renders the body check dead code and does not satisfy this criterion. Category: access_control."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_008"
description = "The agent's submitted diff satisfies this rubric item: A test asserts that path traversal in the attachment name parameter (e.g., ../<other-id>/policy.pdf) cannot be used to retrieve another schedule's private attachment content. A status-code-only assertion does not satisfy this item; the test must seed a sentinel into the target schedule's attachment and verify it is absent from the traversal response. Category: traversal."
type = "binary"
weight = 2.0

[[criterion]]
name = "rub_009"
description = "The agent's submitted diff satisfies this rubric item: A test exercises the clone-then-PATCH laundering flow: a stranger clones a private schedule owned by another user, then PATCHes the clone's title; the test asserts the clone response and the PATCH response do not expose the original owner's private internal_notes sentinel. A status-code-only assertion does not satisfy this item. Category: redaction."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_010"
description = "The agent's submitted diff satisfies this rubric item: A test exercises the clone-then-publish laundering flow: a stranger clones a private schedule owned by another user, then calls POST /schedules/{id}/publish on the clone; the test asserts neither the clone response nor the publish response exposes the original owner's private internal_notes sentinel. A status-code-only assertion does not satisfy this item. Category: redaction."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_011"
description = "The agent's submitted diff satisfies this rubric item: A test exercises the clone-then-export laundering flow: a stranger clones a private schedule owned by another user, then calls GET /schedules/{id}/export?format=json on the clone; the test asserts the export response does not expose the original owner's private internal_notes or rate_code sentinels. A status-code-only assertion does not satisfy this item. Category: redaction."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_012"
description = "The agent's submitted diff satisfies this rubric item: An anti-overblock test asserts that the schedule owner GET /schedules/{id} STILL returns 200 with the private internal_notes field populated. Catches over-eager fixes that redact internal_notes for all callers including the owner. Category: regression_guard."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_013"
description = "The agent's submitted diff satisfies this rubric item: An anti-overblock test asserts that an admin GET /schedules/{id} STILL returns 200 with the private internal_notes field populated. Catches over-eager fixes that scrub responses unconditionally or block admin access. Category: regression_guard."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_014"
description = "The agent's submitted diff satisfies this rubric item: An anti-overblock test asserts that a non-admin user can still POST /schedules (returns 201) and GET /schedules and find their own newly created schedule in the listing. Catches over-eager fixes that restrict the write surface or filter the list so aggressively that users cannot see their own schedules. Category: regression_guard."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_015"
description = "The agent's submission satisfies this negative rubric item: The diff refrains from modifying any file under schedulesvc/ — the agent was explicitly instructed to write tests only and must not alter application source code. Category: constraint_violation."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_016"
description = "The agent's submission satisfies this negative rubric item: The diff refrains from placing any files outside the tests/exfiltration/ directory — the task instructions restrict the submission to that path prefix. Category: constraint_violation."
type = "binary"
weight = 1.0

[[criterion]]
name = "rub_017"
description = "The agent's submission satisfies this negative rubric item: The diff refrains from referencing endpoints, HTTP paths, or route names that are not present in the schedulesvc codebase (e.g., /schedules/{id}/share, /schedules/{id}/duplicate, /schedules/{id}/approve, /schedules/{id}/submit). Category: hallucination."
type = "binary"
weight = 1.0

[[criterion]]
name = "rub_018"
description = "The agent's submission satisfies this negative rubric item: The diff refrains from referencing model fields that do not exist in the Schedule or ShiftEntry models (e.g., cost_code, margin_code, discount_pct, internal_comment, client_name). Category: hallucination."
type = "binary"
weight = 1.0

[[criterion]]
name = "rub_019"
description = "The agent's submission satisfies this negative rubric item: The diff refrains from using status-code-only assertions to test cross-owner access on the direct-access endpoints (GET /schedules/{id}, GET /schedules/{id}/entries, GET /schedules/{id}/export, GET /schedules/{id}/attachments); each such test must assert on response body content — specifically that a seeded sentinel string is absent — rather than only checking whether the HTTP status code is 403 or not 200. Category: reward_hacking."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_020"
description = "The agent's submission satisfies this negative rubric item: The diff is concise and refrains from including excessive, unrelated tests that do not directly address the reported data-leakage symptoms (e.g., tests for unrelated CRUD operations, error handling for malformed inputs, or performance assertions). Category: anti_spam."
type = "binary"
weight = 1.0

[scoring]
aggregation = "weighted_mean"
