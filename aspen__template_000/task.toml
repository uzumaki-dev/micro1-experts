schema_version = "1.2"

[task]
name = "aspen/aspen__template_000"
description = "<TASK_DESCRIPTION>"
authors = [{ name = "<EXPERT_NAME>", email = "<EXPERT_EMAIL>" }]
keywords = ["<LANGUAGE>", "<FRAMEWORK>", "<TAG_1>", "<TAG_2>", "<TAG_3>"]

[metadata]
source = "m1-rl-envs"
environment_id = "aspen"
instance_id = "aspen__template_000"
pipeline = "testgen"
task_type = "test_authoring"
rubric_only = true
base_commit = "<PIN_AFTER_BUILD>"      # ← docker run --rm mytask:local git -C /repo rev-parse HEAD

[verifier]
timeout_sec = 1800.0

[verifier.env]
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY:-}"
OPENAI_API_KEY = "${OPENAI_API_KEY:-}"

[agent]
timeout_sec = 3600.0

[environment]
build_timeout_sec = 3600.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
gpus = 0
allow_internet = true
mcp_servers = []

[environment.env]

[solution.env]
