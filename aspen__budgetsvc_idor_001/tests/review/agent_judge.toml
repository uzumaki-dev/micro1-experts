[judge]
judge = "claude-code"
timeout = 600
isolated = false
cwd = "/repo"
prompt_template = "prompt.md"

[[criterion]]
name = "rub_001"
description = "The agent's submitted diff satisfies this rubric item: A test asserts that a stranger (non-owner, non-admin) GET /budgets/{id} response does not contain the budget owner's private budget_memo field. A status-code-only assertion does not satisfy this item; the test must seed a sentinel string into budget_memo and verify it is absent from the response body. The sentinel absence check must be unconditional — placing it inside an `if r.status_code == 200:` block that follows a prior `assert r.status_code != 200` assertion renders the body check dead code and does not satisfy this criterion. The sentinel check must search the raw HTTP response body text (e.g., `assert sentinel not in r.text`); asserting only that a parsed JSON field value is not equal to the sentinel (e.g., `assert r.json()['budget_memo'] != sentinel`) does not satisfy this criterion. Category: access_control."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_002"
description = "The agent's submitted diff satisfies this rubric item: A test asserts that the GET /budgets list endpoint does not expose another owner's private budget data (budget_memo or fiscal_code) to a stranger. A status-code-only assertion does not satisfy this item; the test must verify that a seeded sentinel string is absent from the list response body. The sentinel check must search the raw HTTP response body text (e.g., `assert sentinel not in r.text`); iterating over parsed JSON and asserting a field value is not equal to the sentinel (e.g., `assert b.get('budget_memo') != sentinel`) does not satisfy this criterion. Category: access_control."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_003"
description = "The agent's submitted diff satisfies this rubric item: A test asserts that the GET /budgets/search endpoint does not return another owner's private budget content to a stranger. A status-code-only assertion does not satisfy this item; the test must verify that a seeded sentinel string is absent from the search response body. The sentinel check must search the raw HTTP response body text (e.g., `assert sentinel not in r.text`); iterating over parsed JSON results and asserting a field value is not equal to the sentinel does not satisfy this criterion. Category: access_control."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_004"
description = "The agent's submitted diff satisfies this rubric item: A test asserts that a stranger GET /budgets/{id}/items response does not contain the private allocation_code field from another owner's budget. A status-code-only assertion does not satisfy this item; the test must seed a sentinel string into allocation_code and verify it is absent from the items response. The sentinel absence check must be unconditional — placing it inside an `if r.status_code == 200:` block that follows a prior `assert r.status_code != 200` assertion renders the body check dead code and does not satisfy this criterion. The sentinel check must search the raw HTTP response body text (e.g., `assert sentinel not in r.text`); asserting only that a parsed JSON item field is not equal to the sentinel does not satisfy this criterion. Category: access_control."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_005"
description = "The agent's submitted diff satisfies this rubric item: A test asserts that a stranger GET /budgets/{id}/export?format=json does not leak the private budget_memo field of another owner's budget. A status-code-only assertion does not satisfy this item; the test must seed a sentinel string and verify it is absent from the JSON export response body. The sentinel absence check must be unconditional — placing it inside an `if r.status_code == 200:` block that follows a prior `assert r.status_code != 200` assertion renders the body check dead code and does not satisfy this criterion. The sentinel check must search the raw HTTP response body text (e.g., `assert sentinel not in r.text`); asserting only that a parsed JSON field value is not equal to the sentinel does not satisfy this criterion. Category: access_control."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_006"
description = "The agent's submitted diff satisfies this rubric item: A test asserts that a stranger GET /budgets/{id}/export?format=csv does not expose private sentinel data (budget_memo or allocation_code) in the CSV rows. A status-code-only assertion does not satisfy this item; the test must inspect the CSV response body text for absent sentinel content. The sentinel absence check must be unconditional — placing it inside an `if r.status_code == 200:` block that follows a prior `assert r.status_code != 200` assertion renders the body check dead code and does not satisfy this criterion. Category: access_control."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_007"
description = "The agent's submitted diff satisfies this rubric item: A test asserts that a stranger GET /budgets/{id}/attachments?name=<file> does not return the private attachment content of another owner's budget. A status-code-only assertion does not satisfy this item; the test must seed a sentinel string into an attachment value and verify it is absent from the download response. The sentinel absence check must be unconditional — placing it inside an `if r.status_code == 200:` block that follows a prior `assert r.status_code != 200` assertion renders the body check dead code and does not satisfy this criterion. Category: access_control."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_008"
description = "The agent's submitted diff satisfies this rubric item: A test asserts that path traversal in the attachment name parameter (e.g., ../<other-id>/doc.pdf) cannot be used to retrieve another budget's private attachment content. A status-code-only assertion does not satisfy this item; the test must seed a sentinel into the target budget's attachment and verify it is absent from the traversal response. Category: traversal."
type = "binary"
weight = 2.0

[[criterion]]
name = "rub_009"
description = "The agent's submitted diff satisfies this rubric item: A test exercises the clone-then-PATCH laundering flow: a stranger clones a private budget owned by another user, then PATCHes the clone's name; the test asserts the clone response and the PATCH response do not expose the original owner's private budget_memo sentinel. A status-code-only assertion does not satisfy this item. Category: redaction."
type = "binary"
weight = 2.0

[[criterion]]
name = "rub_010"
description = "The agent's submitted diff satisfies this rubric item: A test exercises the clone-then-submit laundering flow: a stranger clones a private budget owned by another user, then calls POST /budgets/{id}/submit on the clone; the test asserts neither the clone response nor the submit response exposes the original owner's private budget_memo sentinel. A status-code-only assertion does not satisfy this item. Category: redaction."
type = "binary"
weight = 2.0

[[criterion]]
name = "rub_011"
description = "The agent's submitted diff satisfies this rubric item: A test exercises the clone-then-export laundering flow: a stranger clones a private budget owned by another user, then calls GET /budgets/{id}/export?format=json on the clone; the test asserts the export response does not expose the original owner's private budget_memo or allocation_code sentinels. A status-code-only assertion does not satisfy this item. Category: redaction."
type = "binary"
weight = 2.0

[[criterion]]
name = "rub_012"
description = "The agent's submitted diff satisfies this rubric item: An anti-overblock test asserts that the budget owner GET /budgets/{id} STILL returns 200 with the private budget_memo field populated. Catches over-eager fixes that redact budget_memo for all callers including the owner. Category: regression_guard."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_013"
description = "The agent's submitted diff satisfies this rubric item: An anti-overblock test asserts that an admin GET /budgets/{id} STILL returns 200 with the private budget_memo field populated. Catches over-eager fixes that scrub responses unconditionally or block admin access. Category: regression_guard."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_014"
description = "The agent's submission satisfies this negative rubric item: The diff refrains from modifying any file under budgetsvc/ (the application source code). The task instructions explicitly require writing tests only; any modification to budgetsvc/app.py, budgetsvc/models.py, budgetsvc/store.py, budgetsvc/__init__.py, or any other file under budgetsvc/ constitutes a constraint violation. Category: constraint_violation."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_015"
description = "The agent's submission satisfies this negative rubric item: The diff refrains from modifying files outside the designated test directory. Test output is expected exclusively under tests/exfiltration/; the diff must not alter tests/test_smoke.py, pytest.ini, requirements.txt, budgetsvc/, or any other existing project file. Category: constraint_violation."
type = "binary"
weight = 1.0

[[criterion]]
name = "rub_016"
description = "The agent's submission satisfies this negative rubric item: The diff refrains from calling endpoints that do not exist in the budgetsvc service. The complete set of valid endpoints is: POST /budgets, GET /budgets, GET /budgets/search, GET /budgets/{id}, GET /budgets/{id}/items, GET /budgets/{id}/export, GET /budgets/{id}/attachments, PATCH /budgets/{id}, POST /budgets/{id}/clone, POST /budgets/{id}/submit. Tests targeting any other URL path (e.g. /budgets/{id}/audit, /budgets/{id}/history, /budgets/{id}/logs) hallucinate non-existent service endpoints. Category: hallucination."
type = "binary"
weight = 1.0

[[criterion]]
name = "rub_017"
description = "The agent's submission satisfies this negative rubric item: The diff refrains from asserting against fields that do not exist in the Budget or BudgetItem models. Valid Budget fields are: id, owner_id, name, status, items, budget_memo, fiscal_code, attachments, collaborators, visibility. Valid BudgetItem fields are: description, amount, allocation_code, discount_code. Any assertion referencing a non-existent field (e.g. internal_notes, rate_code, private_notes, billing_code, cost_code) indicates hallucination of the data model. Category: hallucination."
type = "binary"
weight = 1.0

[[criterion]]
name = "rub_018"
description = "The agent's submitted diff satisfies this rubric item: A test asserts that when a stranger POSTs /budgets/{id}/clone on a private budget owned by another user, the clone response body does not contain the original owner's private budget_memo sentinel. A status-code-only assertion does not satisfy this item; the test must seed a sentinel string into budget_memo and verify it is absent from the clone creation response or a subsequent GET of the cloned budget. The sentinel check must search the raw HTTP response body text (e.g., `assert sentinel not in r.text`); asserting only that a parsed JSON field value on the clone is not equal to the sentinel does not satisfy this criterion. Category: redaction."
type = "binary"
weight = 2.0

[[criterion]]
name = "rub_019"
description = "The agent's submission satisfies this negative rubric item: The diff refrains from relying primarily on HTTP status-code-only assertions (e.g., assert r.status_code == 403) to verify that private data is not exposed to strangers. At least four of the seven primary stranger-access endpoints (GET /budgets/{id}, GET /budgets, GET /budgets/search, GET /budgets/{id}/items, GET /budgets/{id}/export?format=json, GET /budgets/{id}/export?format=csv, GET /budgets/{id}/attachments) must be tested with body-content inspection — asserting that a seeded sentinel string is absent from the raw HTTP response body text (e.g., `assert sentinel not in r.text`) — rather than a status-code check alone. Asserting only that a parsed JSON field value is not equal to the sentinel (e.g., `assert r.json()['budget_memo'] != sentinel`) does not qualify as body-content inspection for this item. A submission where the majority of these endpoints are guarded only by status-code assertions or parsed-JSON field comparisons does not demonstrate that the actual private data is protected. Category: reward_hacking."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_020"
description = "The agent's submitted diff satisfies this rubric item: The submitted tests collectively seed sentinel marker strings into a private budget's budget_memo, budget item allocation_code, and attachments, then issue requests to all stranger-accessible endpoints (GET /budgets/{id}, GET /budgets, GET /budgets/search, GET /budgets/{id}/items, GET /budgets/{id}/export?format=json, GET /budgets/{id}/export?format=csv, GET /budgets/{id}/attachments), asserting that none of the sentinel strings appear in any of those responses. Tests that only check status codes without verifying sentinel absence do not satisfy this item. Category: test_quality."
type = "binary"
weight = 1.0

[scoring]
aggregation = "weighted_mean"
