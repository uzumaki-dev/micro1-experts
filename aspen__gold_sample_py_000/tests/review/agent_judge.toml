[judge]
judge = "claude-code"

timeout = 600
isolated = false
cwd = "/repo"
prompt_template = "prompt.md"

[[criterion]]
name = "rub_001"
description = "Non-admin GET /tasks/{id} does not leak sandbox_config private fields (gold_patch_b64, task_config_b64, test_patch_b64, hidden_seed_files). Category: access_control."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_002"
description = "Non-admin GET /coding-tasks (list) redacts sandbox_config fields from every row. Category: access_control."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_003"
description = "Non-admin GET /tasks/{id}/files/{name} returns 4xx for files in sandbox_config.hidden_seed_files (per-task hidden-name awareness). Category: access_control."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_004"
description = "Non-admin GET /runs/{id}/artifacts and /artifacts-zip return 4xx when run mode is a *_validation variant. Category: access_control."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_005"
description = "Non-admin GET /runs/{id}/artifacts and /artifacts-zip return 4xx when run's created_by does not match caller's user_id. Category: ownership."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_006"
description = "Duplicate-then-PATCH laundering: non-admin duplicates a task, PATCHes the clone's name — PATCH response does not leak inherited private sandbox_config fields. Category: redaction."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_007"
description = "Duplicate-then-share laundering: non-admin duplicates a task, calls /tasks/{id}/share on clone — share response does not leak inherited private fields. Category: redaction."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_008"
description = "Duplicate-then-export laundering: non-admin duplicates a task, calls GET /tasks/{id}/export on clone — export response does not leak inherited private fields. Category: redaction."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_009"
description = "Anti-overblock: admin GET /coding-tasks list STILL returns rows with private sandbox_config fields visible. Category: regression_guard."
type = "binary"
weight = 2.0

[[criterion]]
name = "rub_010"
description = "Anti-overblock: non-admin can still /tasks/{id}/duplicate, share, and export on their own (or shared) tasks. Category: regression_guard."
type = "binary"
weight = 2.0

[[criterion]]
name = "rub_011"
description = "Anti-overblock: non-admin GET /tasks/{id}/files/public_readme.md (or equivalent public seed file) still returns 200 with correct content. Category: regression_guard."
type = "binary"
weight = 2.0

[[criterion]]
name = "rub_012"
description = "[NEGATIVE] Non-admin cannot use path traversal (.. segments) in /tasks/{id}/files/{path} to reach .golden/ or other private subdirectories. Category: constraint_violation."
type = "binary"
weight = 2.0

[[criterion]]
name = "rub_013"
description = "[NEGATIVE] Tests seed sentinel markers into private artifacts (gold patch, hidden files, validation run outputs) and assert they never appear in non-admin responses. Category: reward_hacking."
type = "binary"
weight = 1.0

[scoring]
aggregation = "weighted_mean"