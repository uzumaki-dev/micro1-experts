[judge]
judge = "claude-code"
timeout = 600
isolated = false
cwd = "/repo"
prompt_template = "prompt.md"

[[criterion]]
name = "rub_001"
description = "The agent's submitted diff satisfies this rubric item: A test asserts that a stranger (non-owner, non-doctor, non-admin) GET /records/{id} response does not contain the record owner's private diagnosis field. A status-code-only assertion does not satisfy this item; the test must seed a sentinel string into diagnosis and verify it is absent from the response body. The sentinel absence check must be unconditional — placing it inside an `if r.status_code == 200:` block that follows a prior `assert r.status_code != 200` assertion renders the body check dead code and does not satisfy this criterion. Category: access_control."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_002"
description = "The agent's submitted diff satisfies this rubric item: A test asserts that the GET /records list endpoint does not expose another patient's private diagnosis or clinical_notes field to a stranger. A status-code-only assertion does not satisfy this item; the test must verify that a seeded sentinel string is absent from the list response body. Category: access_control."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_003"
description = "The agent's submitted diff satisfies this rubric item: A test asserts that the GET /records/search endpoint does not return another patient's private record content (diagnosis or clinical_notes) to a stranger. A status-code-only assertion does not satisfy this item; the test must verify that a seeded sentinel string is absent from the search response body. Category: access_control."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_004"
description = "The agent's submitted diff satisfies this rubric item: A test asserts that a stranger GET /records/{id}/labs response does not contain the private lab_results of another patient's record. A status-code-only assertion does not satisfy this item; the test must seed a sentinel string into a lab result value and verify it is absent from the labs response. The sentinel absence check must be unconditional — placing it inside an `if r.status_code == 200:` block that follows a prior `assert r.status_code != 200` assertion renders the body check dead code and does not satisfy this criterion. Category: access_control."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_005"
description = "The agent's submitted diff satisfies this rubric item: A test asserts that a stranger GET /records/{id}/medications response does not contain the private medications list of another patient's record. A status-code-only assertion does not satisfy this item; the test must seed a sentinel string into the medications list and verify it is absent from the response. The sentinel absence check must be unconditional — placing it inside an `if r.status_code == 200:` block that follows a prior `assert r.status_code != 200` assertion renders the body check dead code and does not satisfy this criterion. Category: access_control."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_006"
description = "The agent's submitted diff satisfies this rubric item: A test asserts that path traversal in the attachment name parameter (e.g., ../<other-id>/scan.pdf) cannot be used to retrieve another record's private attachment content. A status-code-only assertion does not satisfy this item; the test must seed a sentinel string into the target record's attachment and verify it is absent from the traversal response. Category: traversal."
type = "binary"
weight = 2.0

[[criterion]]
name = "rub_007"
description = "The agent's submitted diff satisfies this rubric item: A test exercises the refer-then-GET laundering flow: a stranger calls POST /records/{id}/refer on a private record owned by another patient, then GETs the resulting referred copy; the test asserts the referred copy response does not expose the original patient's private diagnosis or clinical_notes sentinel. A status-code-only assertion does not satisfy this item. Category: redaction."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_008"
description = "The agent's submitted diff satisfies this rubric item: A test exercises the refer-then-export laundering flow: a stranger calls POST /records/{id}/refer on a private record owned by another patient, then calls GET /records/{id}/export?format=json on the referred copy; the test asserts the export response does not expose the original patient's private diagnosis, clinical_notes, or insurance_id sentinels. A status-code-only assertion does not satisfy this item. Category: redaction."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_009"
description = "The agent's submitted diff satisfies this rubric item: An anti-overblock test asserts that the record owner (patient) GET /records/{id} STILL returns 200 with the private diagnosis field populated. Catches over-eager fixes that redact diagnosis for all callers including the owner. Category: regression_guard."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_010"
description = "The agent's submitted diff satisfies this rubric item: An anti-overblock test asserts that the assigned doctor (whose user ID matches the record's doctor_id field) GET /records/{id} STILL returns 200 with the private diagnosis field populated. Catches over-eager fixes that block all non-patient access including the treating physician. Category: regression_guard."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_011"
description = "The agent's submitted diff satisfies this rubric item: An anti-overblock test asserts that an admin GET /records/{id} STILL returns 200 with the private diagnosis field populated. Catches over-eager fixes that scrub responses unconditionally or block admin access. Category: regression_guard."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_012"
description = "The agent's submitted diff satisfies this rubric item: The submitted tests collectively seed sentinel marker strings into a private record's diagnosis, lab_results, medications, clinical_notes, and insurance_id, then issue requests to all stranger-accessible endpoints (GET /records/{id}, GET /records, GET /records/search, GET /records/{id}/labs, GET /records/{id}/medications, GET /records/{id}/export?format=json), asserting that none of the sentinel strings appear in any of those responses. Tests that only check status codes without verifying sentinel absence do not satisfy this item. Category: test_quality."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_013"
description = "The agent's submission satisfies this negative rubric item: The diff refrains from modifying any file outside the designated test directory (tests/exfiltration/), as required by the task instructions. Category: constraint_violation."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_014"
description = "The agent's submission satisfies this negative rubric item: The diff refrains from referencing endpoints, model fields, or module names that are not present in the patientsvc codebase — for example, endpoints such as /records/{id}/history or /records/{id}/permissions, or fields such as ssn, password, or dob that do not exist in the MedRecord model. Category: hallucination."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_015"
description = "The agent's submission satisfies this negative rubric item: The diff refrains from including excessive, unrelated test content — such as tests for unrelated services, bulk-generated boilerplate, or large numbers of near-identical repeated assertions — that does not directly address the IDOR access-control scenario described in the task. Category: anti_spam."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_016"
description = "The agent's submission satisfies this negative rubric item: The diff refrains from submitting vacuous, always-passing assertions such as bare `assert True`, `assert r is not None`, or `assert r.status_code >= 0` that pass regardless of whether the actual security invariant holds. Category: reward_hacking."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_017"
description = "The agent's submission satisfies this negative rubric item: The diff refrains from relying solely on HTTP status code assertions (e.g., `assert r.status_code == 403`) without any response body inspection for sentinel content absence. Status-code-only assertions do not prove that private content is withheld and do not satisfy the direct-coverage rubric items. Category: reward_hacking."
type = "binary"
weight = 2.0

[[criterion]]
name = "rub_018"
description = "The agent's submission satisfies this negative rubric item: The diff refrains from importing non-existent test utilities, fixture helpers, or modules that are not present in the repository (e.g., `from patientsvc.testing import ...`, `from tests.helpers import ...`, or any other import that cannot be resolved against the repo's actual file tree). Category: hallucination."
type = "binary"
weight = 2.0

[scoring]
aggregation = "weighted_mean"
