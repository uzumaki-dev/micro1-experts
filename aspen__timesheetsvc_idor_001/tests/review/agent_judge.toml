[judge]
judge = "claude-code"
timeout = 600
isolated = false
cwd = "/repo"
prompt_template = "prompt.md"

[[criterion]]
name = "rub_001"
description = "The agent's submitted diff satisfies this rubric item: A test asserts that a stranger (non-owner, non-admin) GET /timesheets/{id} response does not contain the timesheet owner's private internal_notes field. A status-code-only assertion does not satisfy this item; the test must seed a sentinel string into internal_notes and verify it is absent from the response body. The sentinel absence check must be unconditional — placing it inside an `if r.status_code == 200:` block that follows a prior `assert r.status_code != 200` assertion renders the body check dead code and does not satisfy this criterion. Category: access_control."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_002"
description = "The agent's submitted diff satisfies this rubric item: A test asserts that the GET /timesheets list endpoint does not expose another owner's private timesheet data (internal_notes or rate_code) to a stranger. A status-code-only assertion does not satisfy this item; the test must verify that a seeded sentinel string is absent from the list response body. Category: access_control."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_003"
description = "The agent's submitted diff satisfies this rubric item: A test asserts that the GET /timesheets/search endpoint does not return another owner's private timesheet content to a stranger. A status-code-only assertion does not satisfy this item; the test must verify that a seeded sentinel string is absent from the search response body. Category: access_control."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_004"
description = "The agent's submitted diff satisfies this rubric item: A test asserts that a stranger GET /timesheets/{id}/entries response does not contain the private rate_code field from another owner's timesheet. A status-code-only assertion does not satisfy this item; the test must seed a sentinel string into rate_code and verify it is absent from the entries response. The sentinel absence check must be unconditional — placing it inside an `if r.status_code == 200:` block that follows a prior `assert r.status_code != 200` assertion renders the body check dead code and does not satisfy this criterion. Category: access_control."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_005"
description = "The agent's submitted diff satisfies this rubric item: A test asserts that a stranger GET /timesheets/{id}/export?format=json does not leak the private internal_notes field of another owner's timesheet. A status-code-only assertion does not satisfy this item; the test must seed a sentinel string and verify it is absent from the JSON export response body. The sentinel absence check must be unconditional — placing it inside an `if r.status_code == 200:` block that follows a prior `assert r.status_code != 200` assertion renders the body check dead code and does not satisfy this criterion. Category: access_control."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_006"
description = "The agent's submitted diff satisfies this rubric item: A test asserts that a stranger GET /timesheets/{id}/export?format=csv does not expose private sentinel data (internal_notes or rate_code) in the CSV rows. A status-code-only assertion does not satisfy this item; the test must inspect the CSV response body text for absent sentinel content. The sentinel absence check must be unconditional — placing it inside an `if r.status_code == 200:` block that follows a prior `assert r.status_code != 200` assertion renders the body check dead code and does not satisfy this criterion. Category: access_control."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_007"
description = "The agent's submitted diff satisfies this rubric item: A test asserts that a stranger GET /timesheets/{id}/receipts?name=<file> does not return the private receipt content of another owner's timesheet. A status-code-only assertion does not satisfy this item; the test must seed a sentinel string into a receipt value and verify it is absent from the download response. The sentinel absence check must be unconditional — placing it inside an `if r.status_code == 200:` block that follows a prior `assert r.status_code != 200` assertion renders the body check dead code and does not satisfy this criterion. Category: access_control."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_008"
description = "The agent's submitted diff satisfies this rubric item: A test asserts that path traversal in the receipt name parameter (e.g., ../<other-id>/receipt.pdf) cannot be used to retrieve another timesheet's private receipt content. A status-code-only assertion does not satisfy this item; the test must seed a sentinel into the target timesheet's receipt and verify it is absent from the traversal response. Category: traversal."
type = "binary"
weight = 2.0

[[criterion]]
name = "rub_009"
description = "The agent's submitted diff satisfies this rubric item: A test exercises the clone-then-PATCH laundering flow: a stranger clones a private timesheet owned by another user, then PATCHes the clone's project name; the test asserts the clone response and the PATCH response do not expose the original owner's private internal_notes sentinel. A status-code-only assertion does not satisfy this item. Category: redaction."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_010"
description = "The agent's submitted diff satisfies this rubric item: A test exercises the clone-then-submit laundering flow: a stranger clones a private timesheet owned by another user, then calls POST /timesheets/{id}/submit on the clone; the test asserts neither the clone response nor the submit response exposes the original owner's private internal_notes sentinel. A status-code-only assertion does not satisfy this item. Category: redaction."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_011"
description = "The agent's submitted diff satisfies this rubric item: A test exercises the clone-then-export laundering flow: a stranger clones a private timesheet owned by another user, then calls GET /timesheets/{id}/export?format=json on the clone; the test asserts the export response does not expose the original owner's private internal_notes or rate_code sentinels. A status-code-only assertion does not satisfy this item. Category: redaction."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_012"
description = "The agent's submitted diff satisfies this rubric item: An anti-overblock test asserts that the timesheet owner GET /timesheets/{id} STILL returns 200 with the private internal_notes field populated. Catches over-eager fixes that redact internal_notes for all callers including the owner. Category: regression_guard."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_013"
description = "The agent's submitted diff satisfies this rubric item: An anti-overblock test asserts that an admin GET /timesheets/{id} STILL returns 200 with the private internal_notes field populated. Catches over-eager fixes that scrub responses unconditionally or block admin access. Category: regression_guard."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_014"
description = "The agent's submitted diff satisfies this rubric item: An anti-overblock test asserts that a user listed in a timesheet's collaborators field can still GET /timesheets/{id} and receive a 200 response with the timesheet body readable. Catches over-eager fixes that restrict access to owner-only and exclude explicit collaborators. Category: regression_guard."
type = "binary"
weight = 2.0

[[criterion]]
name = "rub_015"
description = "The agent's submitted diff satisfies this rubric item: An anti-overblock test asserts that a stranger can still GET /timesheets/{id} for a public-visibility timesheet and receive a 200 response with the project field readable. Catches over-eager fixes that block all non-owner access regardless of the timesheet's visibility setting. Category: regression_guard."
type = "binary"
weight = 2.0

[[criterion]]
name = "rub_016"
description = "The agent's submitted diff satisfies this rubric item: An anti-overblock test asserts that a non-admin user can still POST /timesheets (returns 201) and GET /timesheets and find their own newly created timesheet in the listing. Catches over-eager fixes that restrict the write surface or filter the list so aggressively that users cannot see their own timesheets. Category: regression_guard."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_017"
description = "The agent's submitted diff satisfies this rubric item: The submitted tests include a unified sentinel sweep — a single test or assertion block that seeds all three sentinel types (internal_notes, entry rate_code, AND receipt content) and issues requests to at least four of the six stranger-accessible endpoints (GET /timesheets/{id}, GET /timesheets, GET /timesheets/search, GET /timesheets/{id}/entries, GET /timesheets/{id}/export?format=json, GET /timesheets/{id}/export?format=csv), then asserts in one combined check that none of the three sentinel strings appears in any of those responses. Tests that check only one or two sentinel types, or that check each endpoint in isolation with separate seed-and-assert cycles rather than a combined sweep, do not satisfy this item. Category: test_quality."
type = "binary"
weight = 2.0

[scoring]
aggregation = "weighted_mean"
