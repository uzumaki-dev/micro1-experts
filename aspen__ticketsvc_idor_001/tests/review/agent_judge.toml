[judge]
judge = "claude-code"
timeout = 600
isolated = false
cwd = "/repo"
prompt_template = "prompt.md"

[[criterion]]
name = "rub_001"
description = "The agent's submitted diff satisfies this rubric item: A test asserts that a non-agent GET /tickets/{id} response does not contain the internal_notes sentinel value of a ticket created by an agent. A status-code-only assertion does not satisfy this item; the test must inspect response content. Category: access_control."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_002"
description = "The agent's submitted diff satisfies this rubric item: A test asserts that a non-agent GET /tickets (list) response does not contain the internal_notes sentinel value from any ticket in the listing. A status-code-only assertion does not satisfy this item; the test must inspect response content. Category: access_control."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_003"
description = "The agent's submitted diff satisfies this rubric item: A test asserts that a non-agent GET /tickets/search response does not contain the internal_notes sentinel value in any result row. A status-code-only assertion does not satisfy this item; the test must inspect response content. Category: access_control."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_004"
description = "The agent's submitted diff satisfies this rubric item: A test asserts that a non-agent GET /tickets/{id}/export?format=json response does not contain the internal_notes sentinel value. A status-code-only assertion does not satisfy this item; the test must inspect response content. Category: access_control."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_005"
description = "The agent's submitted diff satisfies this rubric item: A test asserts that a non-agent GET /tickets/{id}/export?format=zip response does not contain the internal_notes or private-attachment sentinel bytes inside the zip archive contents. The test must open the zip archive and inspect member bytes, not merely check the HTTP status code. Category: access_control."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_006"
description = "The agent's submitted diff satisfies this rubric item: A test asserts that a non-agent GET /tickets/{id}/attachments?name=<private-file> response does not contain the private attachment sentinel value. A status-code-only assertion does not satisfy this item; the test must inspect response content for the sentinel string. Category: ownership."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_007"
description = "The agent's submitted diff satisfies this rubric item: A test asserts that a non-agent GET /tickets/{id}/comments response does not contain the internal-comment body sentinel value (the body of a comment with type='internal'). A status-code-only assertion does not satisfy this item; the test must inspect response content. Category: access_control."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_008"
description = "The agent's submitted diff satisfies this rubric item: A test exercises the clone-then-GET flow: a non-agent calls POST /tickets/{id}/clone and then GET /tickets/{clone_id}; the test asserts the GET response does not contain the internal_notes sentinel value inherited from the source ticket. A status-code-only assertion does not satisfy this item. Category: redaction."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_009"
description = "The agent's submitted diff satisfies this rubric item: A test exercises the clone-then-export flow: a non-agent calls POST /tickets/{id}/clone and then GET /tickets/{clone_id}/export; the test asserts the export response does not contain any private sentinel value inherited from the source ticket (e.g., the internal_notes sentinel or the private attachment sentinel). A status-code-only assertion does not satisfy this item; the test must inspect response content. Category: redaction."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_010"
description = "The agent's submitted diff satisfies this rubric item: An anti-overblock test asserts that an agent or admin GET /tickets/{id} STILL returns a response containing the internal_notes value (i.e., the field is visible to privileged callers). Catches over-eager fixes that scrub internal_notes unconditionally regardless of caller role. Category: Regression_guard."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_011"
description = "The agent's submitted diff satisfies this rubric item: An anti-overblock test asserts that an agent GET /tickets/{id}/comments STILL returns comments including those with type='internal' (i.e., internal comments remain visible to agents). Catches over-eager fixes that suppress all internal comments regardless of caller role. Category: Regression_guard."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_012"
description = "The agent's submitted diff satisfies this rubric item: Anti-overblock tests assert that a reporter CAN still call POST /tickets/{id}/clone, GET /tickets/{id}/export, and POST /tickets/{id}/comments on their own ticket (each returning 200 or 201, not 403). Catches over-eager fixes that admin-gate the entire write and export surface. Category: Regression_guard."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_013"
description = "The agent's submitted diff satisfies this rubric item: An anti-overblock test asserts that a non-agent can still successfully download a public (non-private) attachment via GET /tickets/{id}/attachments?name=<public-file> (returns 200 with content). Catches over-eager fixes that deny all attachment access to non-agents. Category: Regression_guard."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_014"
description = "The agent's submitted diff satisfies this rubric item: A test asserts that a GET /tickets/{id}/attachments request with a path-traversal name (containing '..' segments, e.g. '../agent_handbook') returns a 4xx status code. Category: traversal."
type = "binary"
weight = 2.0

[[criterion]]
name = "rub_015"
description = "The agent's submitted diff satisfies this rubric item: An anti-overblock test asserts that a non-agent can read their own ticket's description field (the public description body) via GET /tickets/{id} (returns 200 and the description value is present). Catches over-eager fixes that deny all ticket reads to non-agents. Category: Regression_guard."
type = "binary"
weight = 2.0

[[criterion]]
name = "rub_016"
description = "The agent's submitted diff satisfies this rubric item: The submitted tests collectively seed sentinel bytes into internal_notes, a private attachment, and an internal comment body, and then assert that none of those sentinel bytes appear in any non-agent response across all leak surfaces (GET /tickets/{id}, GET /tickets, GET /tickets/search, GET /tickets/{id}/export, GET /tickets/{id}/comments), including inside zip archive contents. Category: test_quality."
type = "binary"
weight = 1.0

[scoring]
aggregation = "weighted_mean"
rubric_max_score = 44.0
