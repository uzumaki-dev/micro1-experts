[judge]
judge = "claude-code"
timeout = 600
isolated = false
cwd = "/repo"
prompt_template = "prompt.md"

[[criterion]]
name = "rub_001"
description = "The agent's submitted diff satisfies this rubric item: A test asserts that a member's DELETE /workspaces/{id} request is rejected (status code not in 200 or 204) AND that the workspace was not deleted — verified by issuing a subsequent GET /workspaces/{id} as the workspace owner and asserting a 200 response with the workspace body intact. A test that only checks the status code of the DELETE response without verifying the server state was not mutated does not satisfy this criterion. Category: access_control."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_002"
description = "The agent's submitted diff satisfies this rubric item: A test asserts that a member's POST /workspaces/{id}/archive request is rejected (status code not in 200 or 201) AND that the workspace's is_archived field is still false — verified by issuing a subsequent GET /workspaces/{id} and asserting is_archived is false. A status-code-only assertion without verifying the is_archived state does not satisfy this criterion. Category: access_control."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_003"
description = "The agent's submitted diff satisfies this rubric item: A test asserts that a member's POST /workspaces/{id}/invites request is rejected (status code not in 200 or 201) AND that the invited user does NOT appear in the workspace's members dict — verified by comparing the members dict before and after via GET /workspaces/{id}. A status-code-only assertion without verifying the members dict is unchanged does not satisfy this criterion. Category: access_control."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_004"
description = "The agent's submitted diff satisfies this rubric item: A test asserts that a member's POST /workspaces/{id}/suspend/{uid} request is rejected (status code not in 200 or 201) AND that the target member is not marked as suspended — verified by issuing a subsequent GET /workspaces/{id} and asserting the target user_id does not appear in the suspended dict with value true. A status-code-only assertion without verifying the suspended state does not satisfy this criterion. Category: access_control."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_005"
description = "The agent's submitted diff satisfies this rubric item: A test asserts that a member's PATCH /workspaces/{id}/members/{uid} request is rejected (status code not in 200 or 201) AND that the target member's role is unchanged — verified by issuing a subsequent GET /workspaces/{id} and asserting the target member's role matches its original value. A status-code-only assertion without verifying the role was not changed does not satisfy this criterion. Category: access_control."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_006"
description = "The agent's submitted diff satisfies this rubric item: A test asserts that a member's PATCH /workspaces/{id} request to update settings is rejected (status code not in 200 or 201) AND that the workspace's billing_email field is unchanged — verified by issuing a subsequent GET /workspaces/{id} and asserting billing_email still equals its original value. A status-code-only assertion without verifying the billing_email was not changed does not satisfy this criterion. Category: access_control."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_007"
description = "The agent's submitted diff satisfies this rubric item: A test asserts that a member's GET /workspaces/{id}/audit-log response does not contain the private_reason sentinel string seeded by the owner into an audit event. A status-code-only assertion does not satisfy this criterion; the test must seed a sentinel string into private_reason (e.g., via POST /workspaces/{id}/invites with a private_reason value) and verify the sentinel is absent from the member's audit-log response body. Category: access_control."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_008"
description = "The agent's submitted diff satisfies this rubric item: A test exercises the self-promote laundering flow: a member calls PATCH /workspaces/{id}/members/{self} to elevate their own role to admin or owner, then verifies (via GET /workspaces/{id}) that their role is still 'member', then calls DELETE /workspaces/{id} and asserts the delete is still rejected (status not in 200 or 204). The test must check both the role-unchanged assertion and the subsequent delete-rejected assertion. Category: redaction."
type = "binary"
weight = 2.0

[[criterion]]
name = "rub_009"
description = "The agent's submitted diff satisfies this rubric item: An anti-overblock test asserts that a workspace owner CAN successfully DELETE /workspaces/{id} (returns 200 or 204). Catches over-eager fixes that block all delete requests including from owners. Category: regression_guard."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_010"
description = "The agent's submitted diff satisfies this rubric item: An anti-overblock test asserts that a workspace admin CAN successfully POST /workspaces/{id}/archive (returns 200) AND that a subsequent GET /workspaces/{id} returns is_archived equal to true. Catches over-eager fixes that block archiving for all callers. Category: regression_guard."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_011"
description = "The agent's submitted diff satisfies this rubric item: An anti-overblock test asserts that a workspace admin CAN successfully POST /workspaces/{id}/suspend/{uid} (returns 200) AND that a subsequent GET /workspaces/{id} shows the target user_id present in the suspended dict with value true. Catches over-eager fixes that block suspend for all callers. Category: regression_guard."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_012"
description = "The agent's submitted diff satisfies this rubric item: An anti-overblock test asserts that a workspace admin CAN successfully GET /workspaces/{id}/audit-log (returns 200) AND that the private_reason sentinel seeded by the owner IS present in the response body. Catches over-eager fixes that scrub private_reason from all callers including admins. Category: regression_guard."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_013"
description = "The agent's submitted diff satisfies this rubric item: An anti-overblock test asserts that a workspace admin CAN successfully PATCH /workspaces/{id} to update settings (returns 200) AND that a subsequent GET /workspaces/{id} reflects the updated billing_email value. Catches over-eager fixes that block settings updates for all callers. Category: regression_guard."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_014"
description = "The agent's submitted diff satisfies this rubric item: The submitted tests collectively seed a sentinel marker string into private_reason (via an owner-seeded audit event through POST /workspaces/{id}/invites or POST /workspaces/{id}/suspend), verify that a member's GET /workspaces/{id}/audit-log response does not contain the sentinel, AND at least one test issues a follow-up GET /workspaces/{id} after a rejected privileged operation to verify the server state was not mutated. Tests that only assert HTTP status codes without performing body inspection or state verification do not satisfy this item. Category: test_quality."
type = "binary"
weight = 1.0

[[criterion]]
name = "rub_015"
description = "The agent's submission satisfies this negative rubric item: The diff refrains from modifying any file under the `workspacesvc/` application directory; the task explicitly requires writing tests only and must not alter application source code. Category: constraint_violation."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_016"
description = "The agent's submission satisfies this negative rubric item: The diff refrains from placing test files outside `tests/exfiltration/`; all submitted test files must reside under that path. Category: constraint_violation."
type = "binary"
weight = 1.0

[[criterion]]
name = "rub_017"
description = "The agent's submission satisfies this negative rubric item: The diff refrains from referencing API endpoints that are not present in the workspacesvc codebase (e.g., inventing a `/workspaces/{id}/permissions` or `/workspaces/{id}/roles` endpoint that does not exist). Category: hallucination."
type = "binary"
weight = 1.0

[[criterion]]
name = "rub_018"
description = "The agent's submission satisfies this negative rubric item: The diff refrains from referencing model fields that are not present in the workspacesvc data model (e.g., inventing a `is_public` field, a `role_level` field, or a `permissions` list that does not exist in Workspace or AuditEvent). Category: hallucination."
type = "binary"
weight = 1.0

[[criterion]]
name = "rub_019"
description = "The agent's submission satisfies this negative rubric item: The diff refrains from including test functions whose bodies consist solely of `pass`, `assert True`, or other vacuously-passing statements that cannot detect any real behaviour. Category: reward_hacking."
type = "binary"
weight = 1.0

[[criterion]]
name = "rub_020"
description = "The agent's submission satisfies this negative rubric item: The diff refrains from duplicating the same assertion verbatim across three or more test functions without meaningfully varying the fixture state, caller identity, or endpoint under test — a pattern that inflates test count without adding coverage. Category: anti_spam."
type = "binary"
weight = 1.0

[scoring]
aggregation = "weighted_mean"
