[judge]
judge = "claude-code"
timeout = 600
isolated = false
cwd = "/repo"
prompt_template = "prompt.md"

[[criterion]]
name = "rub_001"
description = "The agent's submitted diff satisfies this rubric item: A test attempts to override the `status` field of an order owned by a non-admin user via PATCH /orders/{id} by including a specific non-default status value (e.g., 'shipped' or 'delivered') in the request body, then issues a separate GET /orders/{id} request after the PATCH and asserts that the `status` field in the GET response body does NOT equal the seeded override value. A status-code-only assertion on the PATCH response (e.g., assert r.status_code == 403) does not satisfy this item — a correct implementation may return 200 and silently ignore the privileged field. Checking only the immediate PATCH response body (e.g., `assert patch_response.json()['status'] == 'pending'`) does NOT satisfy this item — even though the service echoes stored state in the mutation response, the criterion explicitly requires a subsequent GET /orders/{id} HTTP call whose response body is then inspected. Category: access_control."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_002"
description = "The agent's submitted diff satisfies this rubric item: A test attempts to override the `discount_pct` field of an order owned by a non-admin user via PATCH /orders/{id} by including a specific non-zero, non-default discount value (e.g., 97.3) in the request body, then issues a separate GET /orders/{id} request after the PATCH and asserts that the `discount_pct` field in the GET response body does NOT equal the seeded override value. A status-code-only assertion on the PATCH response does not satisfy this item. Checking only the immediate PATCH response body (e.g., `assert patch_response.json()['discount_pct'] == 0.0`) does NOT satisfy this item — even though the service echoes stored state in the mutation response, the criterion explicitly requires a subsequent GET /orders/{id} HTTP call whose response body is then inspected. Category: access_control."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_003"
description = "The agent's submitted diff satisfies this rubric item: A test attempts to override the `payment_status` field of an order owned by a non-admin user via PATCH /orders/{id} by including a specific non-default payment status value (e.g., 'paid' or 'refunded') in the request body, then issues a separate GET /orders/{id} request after the PATCH and asserts that the `payment_status` field in the GET response body does NOT equal the seeded override value. A status-code-only assertion on the PATCH response does not satisfy this item. Checking only the immediate PATCH response body (e.g., `assert patch_response.json()['payment_status'] == 'unpaid'`) does NOT satisfy this item — even though the service echoes stored state in the mutation response, the criterion explicitly requires a subsequent GET /orders/{id} HTTP call whose response body is then inspected. Category: access_control."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_004"
description = "The agent's submitted diff satisfies this rubric item: A test creates an order via POST /orders with a specific non-default `status` value included in the request body (e.g., 'shipped' or 'delivered'), then issues a separate GET /orders/{id} request after the POST and asserts that the `status` field in the GET response body equals 'pending' — not the seeded override. The test must include the seeded non-default value explicitly in the POST body (not merely create a normal order and check the default). A status-code-only assertion on the POST response does not satisfy this item. Checking only the immediate POST response body (e.g., `assert post_response.json()['status'] == 'pending'`) does NOT satisfy this item — even though the service echoes stored state in the creation response, the criterion explicitly requires a subsequent GET /orders/{id} HTTP call whose response body is then inspected. Category: access_control."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_005"
description = "The agent's submitted diff satisfies this rubric item: A test creates an order via POST /orders with a specific non-zero `discount_pct` value included in the request body (e.g., 88.5), then issues a separate GET /orders/{id} request after the POST and asserts that the `discount_pct` field in the GET response body equals 0.0 — not the seeded override. The test must include the seeded non-zero value explicitly in the POST body. A status-code-only assertion on the POST response does not satisfy this item. Checking only the immediate POST response body (e.g., `assert post_response.json()['discount_pct'] == 0.0`) does NOT satisfy this item — even though the service echoes stored state in the creation response, the criterion explicitly requires a subsequent GET /orders/{id} HTTP call whose response body is then inspected. Category: access_control."
type = "binary"
weight = 3.0

[[criterion]]
name = "rub_006"
description = "The agent's submitted diff satisfies this rubric item: An anti-overblock test asserts that an order owner CAN successfully PATCH /orders/{id} with a new `shipping_address` value and receive a 200 response, with the GET /orders/{id} response body reflecting the updated `shipping_address`. Catches over-eager fixes that block all PATCH requests regardless of which fields are being updated. Category: Regression_guard."
type = "binary"
weight = 2.0

[[criterion]]
name = "rub_007"
description = "The agent's submitted diff satisfies this rubric item: An anti-overblock test asserts that an admin CAN successfully PATCH /orders/{id} with a new `status` value (e.g., 'confirmed') and the GET /orders/{id} response body reflects the updated status field. Catches over-eager fixes that block privileged-field updates for ALL callers including admin. Category: Regression_guard."
type = "binary"
weight = 1.0

[[criterion]]
name = "rub_008"
description = "The agent's submitted diff satisfies this rubric item: An anti-overblock test asserts that an order owner CAN successfully POST /orders/{id}/cancel and receive a 200 response with the order status updated to 'cancelled'. Catches over-eager fixes that prevent legitimate owner-initiated state transitions. Category: Regression_guard."
type = "binary"
weight = 1.0

[[criterion]]
name = "rub_009"
description = "The agent's submitted diff satisfies this rubric item: The submitted tests collectively seed distinct non-default override values into ALL THREE privileged PATCH fields — `status`, `discount_pct`, and `payment_status` — via separate PATCH attempts by a non-admin owner, and for each field verify via a separate GET /orders/{id} HTTP call (not the PATCH response body) that the seeded override value was not persisted. Tests that only cover one or two of the three privileged fields do not satisfy this item. Tests that only inspect the PATCH response body (rather than issuing a subsequent GET) do not satisfy this item. Category: test_quality."
type = "binary"
weight = 1.0

[[criterion]]
name = "rub_010"
description = "The agent's submission satisfies this negative rubric item: The diff refrains from modifying any file under the `ordersvc/` application directory; the task explicitly requires writing tests only and must not alter application source code. Category: constraint_violation."
type = "binary"
weight = 1.0

[[criterion]]
name = "rub_011"
description = "The agent's submission satisfies this negative rubric item: The diff refrains from including test functions whose bodies consist solely of `pass`, `assert True`, or other vacuously-passing statements that cannot detect any real behaviour. Category: reward_hacking."
type = "binary"
weight = 1.0

[[criterion]]
name = "rub_012"
description = "The agent's submission satisfies this negative rubric item: The diff refrains from referencing API endpoints, request body fields, or response fields that are not present in the `ordersvc` codebase (e.g., inventing a `/orders/{id}/approve` endpoint or an `is_privileged` body field that does not exist in the service). Category: hallucination."
type = "binary"
weight = 1.0

[[criterion]]
name = "rub_013"
description = "The agent's submission satisfies this negative rubric item: The diff refrains from duplicating the same assertion verbatim across three or more test functions without meaningfully varying the fixture state, caller identity, or privileged field under test — a pattern that inflates test count without adding coverage. Category: anti_spam."
type = "binary"
weight = 1.0

[[criterion]]
name = "rub_014"
description = "The agent's submission satisfies this negative rubric item: The diff refrains from importing or calling internal functions or classes from the `ordersvc` module directly to bypass the HTTP layer and manufacture test outcomes; all assertions must be made against HTTP responses obtained via FastAPI's TestClient or equivalent HTTP client. Category: constraint_violation."
type = "binary"
weight = 1.0

[scoring]
aggregation = "weighted_mean"
